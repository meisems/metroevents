{% extends "base.html" %}
{% block title %}403 Forbidden{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div style="font-size:5rem;">{{ icon('x') }}</div>
  <h2 style="font-weight:800;color:var(--me-ink);">403 — Access Denied</h2>
  <p class="text-muted-sm">You don't have permission to access this page.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn-gold mt-3">{{ icon('arrow-left') }} Back to Dashboard</a>
</div>
{% endblock %}
